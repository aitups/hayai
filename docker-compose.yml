# Hayai — OpenAI-compatible LLM server
# Build:   docker compose build
# Run:     docker compose up -d
# Push:    docker push aitups/hayai:latest

services:
  hayai:
    image: aitups/hayai:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Host models directory. Must be writable by the container user (uid 1000)
      # for `HAYAI_HF` downloads: `sudo chown 1000:1000 models` on Linux,
      # or use a named Docker volume instead of a bind mount.
      - ./models:/hayai/models
    environment:
      # All hayai-server options are configurable via HAYAI_* env vars.
      HAYAI_HOST: "0.0.0.0"
      HAYAI_PORT: "8080"
      HAYAI_MODELS_DIR: "/hayai/models"

      # Model selection:
      #   - auto-scan of HAYAI_MODELS_DIR (*.gguf)
      #   - explicit paths (comma-separated):
      # HAYAI_MODEL: "models/SmolLM2-135M-Instruct-Q4_K_M.gguf"
      #   - download from HuggingFace (defaults to the *Q4_K_M.gguf file):
      # HAYAI_HF: "bartowski/SmolLM2-135M-Instruct-GGUF"
      # HAYAI_HF_FILE: "SmolLM2-135M-Instruct-Q4_K_M.gguf"

      # Engine:
      HAYAI_DEVICE: "auto"                    # auto | cpu | <OpenCL device substring>
      HAYAI_MEMORY_STRATEGY: "minimal"       # auto | minimal | cap_mb
      HAYAI_SINKS: "4"
      HAYAI_WINDOW: "256"
      # HAYAI_CHAT_TEMPLATE: "@chat_template.jinja"
      HAYAI_LOG: "info"
    restart: unless-stopped

    # ─────────────────────────────────────────────────────────────────────────
    # GPU / OpenCL: apply the GPU override file (needs an NVIDIA container
    # runtime and an OpenCL-capable NVIDIA setup — see README "Docker + GPU"):
    #
    #     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    #
    # Without it (or when no OpenCL device is available) Hayai runs CPU-only.
    # ─────────────────────────────────────────────────────────────────────────

    # ─────────────────────────────────────────────────────────────────────────
    # io_uring: Docker's default seccomp profile blocks the io_uring_setup
    # syscall with EPERM ("Operation not permitted"), so Hayai falls back to
    # buffered File I/O. This single-purpose server lifts seccomp so the
    # streaming path actually uses io_uring (verified end-to-end:
    # WeightIo=io_uring). The buffered fallback remains as a safety net.
    # If you deploy with plain `docker run`, add --security-opt seccomp=unconfined.
    # ─────────────────────────────────────────────────────────────────────────
    security_opt:
      - seccomp=unconfined

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
